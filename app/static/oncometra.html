<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Oncometra | Annotation</title>
  <link rel="stylesheet" href="/assets/oncometra.css?v=cohorts-21">
  <script type="module" src="/assets/oncometra.js?v=cohorts-24"></script>
</head>
<body>
  <section id="login-screen" class="login-screen" hidden>
    <form id="login-form" class="login-card">
      <div class="wordmark"><span class="brand-symbol">O</span> ONCOMETRA</div>
      <div class="login-heading"><span class="eyebrow">ANNOTATION</span><h1>Connexion</h1><p>Cohortes, annotation et validation</p></div>
      <label>Nom d’utilisateur<input name="username" autocomplete="username" required></label>
      <label>Mot de passe<input name="password" type="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Se connecter</button><p id="login-error" class="error" role="alert"></p>
      <div class="login-note">Comptes nominatifs. Images dé-identifiées uniquement.</div>
    </form>
  </section>
  <div id="workspace" class="workspace" hidden>
    <header class="app-header"><a class="wordmark" href="/" aria-label="Oncometra"><span class="brand-symbol">O</span> ONCOMETRA</a><span class="header-divider"></span><span class="header-caption">Annotation</span><div class="header-user"><span id="user-avatar" class="avatar"></span><div><strong id="user-name"></strong><small id="user-role"></small></div><button id="logout" class="quiet">Déconnexion</button></div></header>
    <nav id="navigation" class="app-nav" aria-label="Écrans">
      <button data-tab="datasets" data-admin class="selected">Datasets exploitables</button><button data-tab="cohorts">Cohortes</button><button data-tab="review">À valider <span id="work-count" class="nav-count">0</span></button><button data-tab="admin" data-admin>Comptes</button>
      <span class="nav-spacer"></span><span id="storage-status" class="storage-status">Stockage local</span>
    </nav>
    <main id="content" class="content"></main>
    <section id="annotation-page" class="annotation-page" hidden><div class="annotation-context"><div class="annotation-identity"><button id="back-worklist" class="quiet">Retour à la file</button><span id="assignment-context"></span><span id="seg-state" class="seg-state" hidden></span></div><div id="browse-nav" class="browse-nav" hidden><button type="button" id="browse-menu" aria-expanded="false" aria-controls="browse-panel">Patients</button><div id="browse-panel" class="browse-panel" hidden></div></div><div class="annotation-actions"><button id="assignment-guidelines">Protocole</button><button id="assignment-detect" data-title="Lance la détection des organes et des lésions pour cet examen seulement. Un segment SEG déjà présent est conservé pour la comparaison. Le calcul utilise le processeur et peut durer plusieurs minutes." title="Lance la détection des organes et des lésions pour cet examen seulement. Un segment SEG déjà présent est conservé pour la comparaison. Le calcul utilise le processeur et peut durer plusieurs minutes.">Détecter</button><button id="assignment-organs">Organes et HU</button><button id="refresh-assignment">Actualiser</button></div></div><iframe id="viewer" title="Visionneuse d’annotation CT et IRM" allow="fullscreen" allowfullscreen></iframe></section>
    <footer id="app-footer"><span>Cohortes publiques à annoter. Pas un dispositif de décision clinique.</span></footer>
  </div>
  <dialog id="modal"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" class="quiet" aria-label="Close dialog">Close</button></div><div id="modal-body"></div></dialog>
  <dialog id="detection-dialog">
    <div class="modal-heading"><h2 id="detection-title">Détection</h2><button id="detection-close" class="quiet" type="button">Fermer</button></div>
    <p id="detection-detail">Préparation de l’examen…</p>
    <p id="detection-percent" class="detection-percent">0 %</p>
    <div class="detection-track" aria-hidden="true"><span id="detection-bar"></span></div>
    <p id="detection-time">Temps écoulé 00:00:00</p>
    <p id="detection-dice" hidden></p>
    <p id="detection-error" class="error" hidden></p>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
